<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="src/main.js" type="module"></script>
    <title>WitzeApp</title>
  </head>
  <body>
    <main class="app">
      <div class="theme-switch">
        <input
          class="theme-switch__input"
          id="theme-switch"
          type="checkbox"
          aria-label="Light Mode"
        />
        <label class="theme-switch__label" for="theme-switch">
          <span class="theme-switch__option theme-switch__option--dark">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="theme-switch__icon"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
            Dark
          </span>
          <span class="theme-switch__option theme-switch__option--light">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="theme-switch__icon"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>
            Light
          </span>
        </label>
      </div>
      <h1 class="heading">Witze App</h1>
      <div class="current-joke">
        <p class="current-joke__text"></p>
        <div class="current-joke__actions">
          <select
            class="current-joke__category"
            id="category-select"
            aria-label="Kategorie"
          >
            <option value="">Kategorie wählen</option>
          </select>
          <button class="current-joke__generate">Neuer Witz</button>
          <button class="current-joke__save">
            Witz speichern
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="current-joke__save-icon"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="saved-joke">
        <h2 class="saved-joke__heading">Gespeicherte Witze</h2>
        <div class="saved-joke__list"></div>
        <template id="saved-joke-template">
          <div class="saved-joke__item">
            <p class="saved-joke__text"></p>
            <button class="saved-joke__remove" aria-label="Witz löschen">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="saved-joke__remove-icon"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m3 3 1.664 1.664M21 21l-1.5-1.5m-5.485-1.242L12 17.25 4.5 21V8.742m.164-4.078a2.15 2.15 0 0 1 1.743-1.342 48.507 48.507 0 0 1 11.186 0c1.1.128 1.907 1.077 1.907 2.185V19.5M4.664 4.664 19.5 19.5"
                />
              </svg>
            </button>
          </div>
        </template>
      </div>
    </main>
  </body>
</html>
